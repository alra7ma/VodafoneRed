name: Build Vodafone Watch 1.6.0 APK from ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'VodafoneWatch-Android-1.6.0-Project.zip'
      - '.github/workflows/build-from-zip.yml'

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract Android source archive
        run: |
          mkdir -p source
          unzip -q VodafoneWatch-Android-1.6.0-Project.zip -d source
          test -f source/settings.gradle.kts
          test -f source/app/build.gradle.kts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test Vodafone page extractor
        working-directory: source
        run: node tools/test-counter-extractor.js

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Test special-number specification engine
        working-directory: source
        run: tools/test-special-number-analyzer.sh

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          cache-provider: basic

      - name: Build debug APK
        run: gradle -p source :app:assembleDebug --no-daemon --stacktrace

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: VodafoneWatch-1.6.0-debug-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
